<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 响应式配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- LayUI css库 -->
    <link rel="stylesheet" href="../layui/css/layui.css">
    <link rel="stylesheet" href="../css/yaya-common.css">
    <title>工作台</title>
    <style>
        body{
            color: var(--yaya-text-1);
        }
        /* 行改为flex布局,同行卡片等高对齐 */
        .layui-row{
            display: flex;
            flex-wrap: wrap;
        }
        .wb-row{
            margin-top: 15px;
        }
        .wb-row:first-child{
            margin-top: 0;
        }
        /* 统一卡片样式(描边+轻阴影+大圆角) */
        .wb-card{
            background-color: var(--yaya-card);
            border: 1px solid var(--yaya-card-border);
            border-radius: var(--yaya-radius-lg);
            box-shadow: var(--yaya-shadow);
            height: 100%;
            box-sizing: border-box;
        }
        /* 卡片头:标题+底部分隔线 */
        .wb-head{
            padding: 16px 24px;
            border-bottom: 1px solid var(--yaya-gray-200);
        }
        .wb-head h4{
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: var(--yaya-text-1);
        }
        .wb-body{
            padding: 24px;
        }
        /* 右侧列:两张卡片纵向排列 */
        .wb-side{
            display: flex;
            flex-direction: column;
            gap: 24px;
            height: 100%;
        }
        .wb-side .wb-card.grow{
            flex: 1;
        }
        /* ============ 交易情况:四项指标 ============ */
        .trade-stats{
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }
        .ts-item{
            flex: 1;
        }
        .ts-label{
            font-size: 13px;
            color: var(--yaya-text-3);
        }
        .ts-value{
            margin-top: 14px;
            font-size: 28px;
            font-weight: 600;
            color: var(--yaya-text-1);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .ts-value small{
            font-size: 13px;
            font-weight: 400;
            color: var(--yaya-text-2);
            margin-left: 2px;
        }
        #mapChart{
            height: 620px;
            width: 100%;
        }
        /* ============ 活动情况预测 ============ */
        .pd-label{
            font-size: 13px;
            color: var(--yaya-text-3);
        }
        .pd-value{
            margin-top: 8px;
            font-size: 24px;
            font-weight: 600;
            color: var(--yaya-text-1);
        }
        .pd-nums{
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--yaya-gray-300);
        }
        .pd-nums .dark{ color: var(--yaya-text-1); font-weight: 600; }
        .pd-nums .blue{ color: var(--yaya-primary); font-weight: 600; }
        #forecastChart{
            height: 130px;
            width: 100%;
        }
        /* ============ 券核效率 ============ */
        #gaugeChart{
            height: 380px;
            width: 100%;
        }
        /* ============ 各品类占比:环形进度 ============ */
        .ring-row{
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 40px 20px;
        }
        .ring{
            position: relative;
            width: 170px;
            height: 170px;
        }
        .ring>div{
            width: 100%;
            height: 100%;
        }
        .ring-num{
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 600;
            color: var(--yaya-text-1);
            font-variant-numeric: tabular-nums;
        }
        /* ============ 热门搜索:词云 ============ */
        .cloud{
            position: relative;
            height: 300px;
        }
        .wc{
            position: absolute;
            font-weight: 600;
            line-height: 1;
            cursor: default;
            transition: transform .2s ease;
        }
        .wc:hover{
            transform: scale(1.15) rotate(var(--r, 0deg)) !important;
        }
        /* ============ 资源剩余:水球图 ============ */
        .water-wrap{
            display: flex;
            justify-content: center;
            padding: 35px 0;
        }
        .water{
            position: relative;
            width: 190px;
            height: 190px;
            border: 2px solid var(--yaya-primary);
            border-radius: 50%;
            overflow: hidden;
        }
        .water-fill{
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(180deg, #5aabff, #1e8bff);
            border-radius: 45% 47% 0 0 / 12% 14% 0 0;
        }
        .water-num{
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 600;
            color: var(--yaya-text-1);
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div class="yaya-box-fluid">
        <!-- ============ 第一行:实时交易 + 右侧预测/券核 ============ -->
        <div class="layui-row layui-col-space15 wb-row">
            <!-- 左:活动实时交易情况 -->
            <div class="layui-col-md9">
                <div class="wb-card">
                    <div class="wb-head"><h4>活动实时交易情况</h4></div>
                    <div class="wb-body">
                        <div class="trade-stats">
                            <div class="ts-item">
                                <div class="ts-label">今日交易总额</div>
                                <div class="ts-value">124,543,233 <small>元</small></div>
                            </div>
                            <div class="ts-item">
                                <div class="ts-label">销售目标完成率</div>
                                <div class="ts-value">92<small>%</small></div>
                            </div>
                            <div class="ts-item">
                                <div class="ts-label">活动剩余时间</div>
                                <div class="ts-value">47:58:09:516</div>
                            </div>
                            <div class="ts-item">
                                <div class="ts-label">每秒交易总额</div>
                                <div class="ts-value">234 <small>元</small></div>
                            </div>
                        </div>
                        <div id="mapChart"></div>
                    </div>
                </div>
            </div>
            <!-- 右:活动情况预测 + 券核效率 -->
            <div class="layui-col-md3">
                <div class="wb-side">
                    <div class="wb-card">
                        <div class="wb-head"><h4>活动情况预测</h4></div>
                        <div class="wb-body">
                            <div class="pd-label">目标评估</div>
                            <div class="pd-value">有望达到预期</div>
                            <div class="pd-nums">
                                <span class="dark">1436 亿元</span>
                                <span class="blue">709 亿元</span>
                            </div>
                            <div id="forecastChart"></div>
                        </div>
                    </div>
                    <div class="wb-card grow">
                        <div class="wb-head"><h4>券核效率</h4></div>
                        <div class="wb-body">
                            <div id="gaugeChart"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ============ 第二行:各品类占比 + 热门搜索 + 资源剩余 ============ -->
        <div class="layui-row layui-col-space15 wb-row">
            <!-- 各品类占比 -->
            <div class="layui-col-md6">
                <div class="wb-card">
                    <div class="wb-head"><h4>各品类占比</h4></div>
                    <div class="wb-body ring-row">
                        <div class="ring">
                            <div id="ring1"></div>
                            <span class="ring-num">75%</span>
                        </div>
                        <div class="ring">
                            <div id="ring2"></div>
                            <span class="ring-num">48%</span>
                        </div>
                        <div class="ring">
                            <div id="ring3"></div>
                            <span class="ring-num">33%</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 热门搜索(词云) -->
            <div class="layui-col-md3">
                <div class="wb-card">
                    <div class="wb-head"><h4>热门搜索</h4></div>
                    <div class="wb-body">
                        <div class="cloud">
                            <span class="wc" style="left:8%;top:8%;color:#00c6de;font-size:15px;--r:0deg;transform:rotate(0deg) translateY(-50%);writing-mode:vertical-rl;">省份13</span>
                            <span class="wc" style="left:22%;top:4%;color:#409eff;font-size:14px;writing-mode:vertical-rl;">城市9</span>
                            <span class="wc" style="left:42%;top:10%;color:#ffae1f;font-size:15px;">省份8</span>
                            <span class="wc" style="left:66%;top:6%;color:#7b5cf0;font-size:14px;">省份6</span>
                            <span class="wc" style="left:84%;top:9%;color:#409eff;font-size:15px;writing-mode:vertical-rl;">城市12</span>
                            <span class="wc" style="left:34%;top:34%;color:#ff7ab6;font-size:14px;">区划4</span>
                            <span class="wc" style="left:55%;top:38%;color:#409eff;font-size:15px;">区划0</span>
                            <span class="wc" style="left:74%;top:32%;color:#13deb9;font-size:13px;">区划3</span>
                            <span class="wc" style="left:12%;top:52%;color:#ff7ab6;font-size:14px;">省份7</span>
                            <span class="wc" style="left:60%;top:58%;color:#00c6de;font-size:14px;">区划2</span>
                            <span class="wc" style="left:6%;top:78%;color:#ffae1f;font-size:15px;">城市57</span>
                            <span class="wc" style="left:38%;top:80%;color:#13deb9;font-size:15px;">省份15</span>
                            <span class="wc" style="left:68%;top:76%;color:#7bd35f;font-size:15px;">省份10</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 资源剩余(水球图) -->
            <div class="layui-col-md3">
                <div class="wb-card">
                    <div class="wb-head"><h4>资源剩余</h4></div>
                    <div class="wb-body">
                        <div class="water-wrap">
                            <div class="water">
                                <div class="water-fill"></div>
                                <span class="water-num">35 %</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../layui/layui.js"></script>
    <script src="../js/echarts.min.js"></script>
    <script>
        layui.use(function (){
            /* 可复现的伪随机数(保证地图每次刷新形态一致) */
            function rng32(seed){
                return function (){
                    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
                    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                    return ((t ^ t >>> 14) >>> 0) / 4294967296;
                };
            }

            /* ============ 实时交易:六边形气泡地图(装饰性近似) ============ */
            const mapDom = document.getElementById('mapChart');
            const mapChart = echarts.init(mapDom);
            // 六边形底:按大洲簇随机散布(六边形路径符号)
            const HEX = 'path://M25 0 L75 0 L100 50 L75 100 L25 100 L0 50 Z';
            const clusters = [
                { x: 24, y: 30, hex: 26, spread: 17, bubble: 4 },
                { x: 30, y: 64, hex: 14, spread: 10, bubble: 2 },
                { x: 52, y: 24, hex: 16, spread: 9,  bubble: 5 },
                { x: 54, y: 50, hex: 18, spread: 11, bubble: 3 },
                { x: 70, y: 32, hex: 30, spread: 16, bubble: 5 },
                { x: 84, y: 66, hex: 10, spread: 8,  bubble: 1 }
            ];
            const cityNames = ['马拉维','纽约','伦敦','东京','上海','巴黎','悉尼','柏林','首尔','多伦多','圣保罗','开普敦','新加坡','莫斯科','迪拜','温哥华','曼谷','利雅得','内罗毕','墨西哥'];
            const rand = rng32(20260905);
            const hexData = [];
            const bubbleData = [];
            let cityIdx = 0;
            clusters.forEach(function (c){
                for(let i = 0; i < c.hex; i++){
                    hexData.push([
                        +(c.x + (rand() - 0.5) * c.spread).toFixed(2),
                        +(c.y + (rand() - 0.5) * c.spread).toFixed(2),
                        +(10 + rand() * 10).toFixed(1)
                    ]);
                }
                for(let i = 0; i < c.bubble; i++){
                    bubbleData.push({
                        name: cityNames[cityIdx++ % cityNames.length],
                        value: [
                            +(c.x + (rand() - 0.5) * c.spread).toFixed(2),
                            +(c.y + (rand() - 0.5) * c.spread).toFixed(2),
                            Math.round(4 + rand() * 20)
                        ]
                    });
                }
            });
            mapChart.setOption({
                tooltip:{
                    trigger: 'item',
                    formatter: function (p){
                        return p.name + '<br/>交易量: ' + p.value[2];
                    }
                },
                xAxis:{ type: 'value', min: 0, max: 100, show: false },
                yAxis:{ type: 'value', min: 0, max: 100, show: false },
                series:[
                    {
                        type: 'scatter',
                        data: hexData,
                        symbol: HEX,
                        symbolSize: function (d){ return d[2]; },
                        itemStyle: { color: '#e9edf5' },
                        silent: true
                    },
                    {
                        type: 'effectScatter',
                        data: bubbleData,
                        symbolSize: function (d){ return d[2] * 1.6; },
                        itemStyle: { color: 'rgba(126,98,222,.45)', shadowBlur: 8, shadowColor: 'rgba(126,98,222,.4)' },
                        rippleEffect: { scale: 2.4, brushType: 'stroke' }
                    }
                ]
            });

            /* ============ 活动情况预测:迷你面积图 ============ */
            const fcDom = document.getElementById('forecastChart');
            const fcChart = echarts.init(fcDom);
            fcChart.setOption({
                grid:{ left: 0, right: 0, top: 8, bottom: 20 },
                xAxis:{
                    type: 'category',
                    boundaryGap: false,
                    data: ['00:00','08:00','12:00','18:00','23:00'],
                    axisLine: { show: false },
                    axisTick: { show: false },
                    axisLabel: { color: '#949eb7', fontSize: 10 }
                },
                yAxis:{ type: 'value', show: false, max: 1500 },
                series:[{
                    type: 'line',
                    smooth: true,
                    symbol: 'none',
                    lineStyle: { color: '#409eff', width: 2 },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(64,158,255,.25)' },
                            { offset: 1, color: 'rgba(64,158,255,.01)' }
                        ])
                    },
                    data: [709, 860, 1020, 1230, 1436]
                }]
            });

            /* ============ 券核效率:仪表盘 ============ */
            const gaugeDom = document.getElementById('gaugeChart');
            const gaugeChart = echarts.init(gaugeDom);
            gaugeChart.setOption({
                series:[{
                    type: 'gauge',
                    startAngle: 210,
                    endAngle: -30,
                    min: 0,
                    max: 100,
                    splitNumber: 5,
                    radius: '92%',
                    center: ['50%', '58%'],
                    axisLine:{
                        lineStyle:{
                            width: 8,
                            color: [[0.3, '#13deb9'], [0.6, '#409eff'], [0.85, '#ffae1f'], [1, '#13deb9']]
                        }
                    },
                    pointer:{
                        length: '58%',
                        width: 4,
                        itemStyle: { color: '#409eff' }
                    },
                    axisTick:{ distance: -13, length: 4, lineStyle: { color: '#c8c9cc' } },
                    splitLine:{ distance: -16, length: 6, lineStyle: { color: '#c8c9cc' } },
                    axisLabel:{ distance: -26, color: '#949eb7', fontSize: 10 },
                    detail:{
                        formatter: '优',
                        fontSize: 16,
                        color: '#323251',
                        offsetCenter: [0, '38%']
                    },
                    data:[{ value: 80 }]
                }]
            });

            /* ============ 各品类占比:三个环形进度 ============ */
            function initRing(id, value){
                const dom = document.getElementById(id);
                const chart = echarts.init(dom);
                chart.setOption({
                    tooltip:{ show: false },
                    series:[{
                        type: 'pie',
                        silent: true,
                        startAngle: 90,
                        radius: ['72%', '88%'],
                        label: { show: false },
                        labelLine: { show: false },
                        animationDuration: 800,
                        data:[
                            { value: value, itemStyle: { color: '#409eff' } },
                            { value: 100 - value, itemStyle: { color: '#eef1f6' } }
                        ]
                    }]
                });
                return chart;
            }
            const ringCharts = [
                initRing('ring1', 75),
                initRing('ring2', 48),
                initRing('ring3', 33)
            ];

            /* ============ 容器尺寸变化时自动重绘(修复选项卡切换后图表宽度丢失问题) ============ */
            function observeResize(dom, chart){
                new ResizeObserver(function (){
                    if(dom.clientWidth > 0){ chart.resize(); }
                }).observe(dom);
            }
            observeResize(mapDom, mapChart);
            observeResize(fcDom, fcChart);
            observeResize(gaugeDom, gaugeChart);
            ['ring1','ring2','ring3'].forEach(function (id, i){
                observeResize(document.getElementById(id), ringCharts[i]);
            });
        })
    </script>
</body>
</html>
