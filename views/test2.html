<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8" />
    <title>房屋管理</title>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3"></script>
    <!-- Element Plus -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <script src="https://unpkg.com/element-plus"></script>
    <style>
        body {
            padding: 0 20px 0 20px;
        }
        .search-box {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
<div id="app">
    <!-- 搜索区域 -->
    <el-card class="search-box">
        <h4>查询条件（基于Element UI，使用Gemini模型生成）</h4>
        <el-form :inline="true" :model="searchForm">
            <el-form-item label="小区名称">
                <el-input v-model="searchForm.communityName" placeholder="请输入小区名称"></el-input>
            </el-form-item>

            <el-form-item label="楼栋">
                <el-input v-model="searchForm.building" placeholder="请输入楼栋"></el-input>
            </el-form-item>

            <el-form-item label="单元">
                <el-input v-model="searchForm.unit" placeholder="请输入单元"></el-input>
            </el-form-item>

            <el-form-item>
                <el-button type="primary" @click="handleSearch">查询</el-button>
                <el-button @click="resetForm">重置</el-button>
                <el-button type="success" @click="handleAdd">新增</el-button>
            </el-form-item>
        </el-form>
    </el-card>

    <!-- 表格区域 -->
    <el-table :data="tableData" border style="width: 100%" v-loading="loading">
        <el-table-column prop="communityName" label="小区名称" width="150"></el-table-column>
        <el-table-column prop="address" label="小区地址"></el-table-column>
        <el-table-column prop="building" label="楼栋号" width="100"></el-table-column>
        <el-table-column prop="unit" label="单元号" width="100"></el-table-column>

        <el-table-column label="操作" width="180">
            <template #default="scope">
                <el-button type="primary" size="small" @click="handleUpdate(scope.row)">更新</el-button>
                <el-button type="danger" size="small" @click="handleDelete(scope.row)">删除</el-button>
            </template>
        </el-table-column>
    </el-table>
</div>

<script>
    const { createApp, ref, reactive } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    const app = createApp({
        setup() {
            const searchForm = reactive({
                communityName: '',
                building: '',
                unit: ''
            });

            const loading = ref(false);

            const tableData = ref([
                { id: 1, communityName: '阳光花园', address: '朝阳区朝阳北路101号', building: '1号楼', unit: '1单元' },
                { id: 2, communityName: '碧水湾', address: '海淀区清河中街5号', building: '6号楼', unit: '2单元' },
                { id: 3, communityName: '万科城市之光', address: '通州区台湖镇', building: '12号楼', unit: '1单元' },
                { id: 4, communityName: '龙湖天街', address: '大兴区生物医药基地', building: '3号楼', unit: '3单元' },
            ]);

            const handleSearch = () => {
                loading.value = true;
                console.log('搜索条件:', { ...searchForm });
                setTimeout(() => {
                    ElMessage.success('查询成功');
                    loading.value = false;
                }, 500);
            };

            const resetForm = () => {
                searchForm.communityName = '';
                searchForm.building = '';
                searchForm.unit = '';
                handleSearch();
            };

            const handleAdd = () => {
                ElMessage.info('点击了新增按钮');
            };

            const handleUpdate = (row) => {
                ElMessage.info(`准备更新：${row.communityName} ${row.building} ${row.unit}`);
            };

            const handleDelete = (row) => {
                ElMessageBox.confirm(
                    `确定要删除 "${row.communityName} - ${row.building} - ${row.unit}" 吗？`,
                    '警告',
                    { type: 'warning' }
                ).then(() => {
                    tableData.value = tableData.value.filter(item => item.id !== row.id);
                    ElMessage.success('删除成功');
                }).catch(() => {
                    ElMessage.info('已取消删除');
                });
            };

            return {
                searchForm,
                tableData,
                loading,
                handleSearch,
                resetForm,
                handleAdd,
                handleUpdate,
                handleDelete
            };
        }
    });

    // 不再传 locale，避免 ElementPlusLocaleZhCn 未定义
    app.use(ElementPlus);

    // 注册图标（可选）
    if (window.ElementPlusIconsVue) {
        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component);
        }
    }

    app.mount('#app');
</script>
</body>
</html>
