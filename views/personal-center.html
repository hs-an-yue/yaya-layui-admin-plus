<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon" />
    <title>用户设置</title>
    <link href="../layui/css/layui.css" rel="stylesheet">
    <link href="../css/yaya-common.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/yaya-style-extend.css">
    <link rel="stylesheet" href="../font/bootstrap-icons.css">
    <style>
        .user-base{
            width: 100%;
            background-color: #fff;
            border-radius: 5px;
        }
        .user-base>div{
            width: 100%;
        }
        .user-base>hr{
            width: 100%;
        }
        .user-info{
            display: flex;
            flex-direction: column;
            flex-wrap: nowrap;
            justify-content: flex-start;
            align-items: center;
        }

        .user-info>p{
            margin-top: 15px;
        }
        .user-info-list>img{
            height: 100px;
            width: 100px;
            border-radius: 50px;
            border: 1px solid #eeeeee;
            margin: 20px 0;
        }
        .user-info-list{
            display: flex;
            flex-direction: column;
            flex-wrap: nowrap;
            justify-content: flex-start;
            align-items: center;
        }
        .user-info-detail{
            width: 80%;
            display: flex;
            flex-direction: column;
            flex-wrap: nowrap;
            justify-content: flex-start;
            padding-bottom: 15px;
        }
        .user-info-detail-item{
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: space-between;
            align-items: center;
            height: 30px;
        }
        .user-info-detail-item>p{
            font-size: 14px;
        }
        .layui-tabs-header .layui-this, .layui-tabs-header li:hover{
            color: #16b777;
        }
        .layui-tabs-header .layui-this:after{
            border-bottom: 3px solid #16b777;
        }
        /*头像*/
        .avatar-container {
            text-align: center;
            margin-top: 20px;
        }
        .avatar-wrapper {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid #ddd;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
            margin: 0 auto;
        }
        .avatar-wrapper:hover {
            transform: scale(1.05);
        }
        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .upload-text {
            margin-top: 10px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="yaya-box-fluid">
    <div class="layui-row layui-col-space20">
        <div class="layui-col-md3 card-hover">
            <div class="user-base user-info">
                <div class="user-info-list">
                    <div class="avatar-container">
                        <div class="avatar-wrapper" id="avatar-upload">
                            <img id="avatarImg" src="../image/avatar.gif" alt="头像" class="avatar">
                        </div>
                        <p class="upload-text">点击头像上传新头像</p>
                    </div>
                    <div class="user-info-detail">
                        <hr>
                        <!--用户账号-->
                        <div class="user-info-detail-item">
                            <p>用户账号</p>
                            <p>199***901</p>
                        </div>
                        <hr>
                        <!--用户邮箱-->
                        <div class="user-info-detail-item">
                            <p>用户邮箱</p>
                            <p>199***901@126.com</p>
                        </div>
                        <hr>
                        <!--用户名称-->
                        <div class="user-info-detail-item">
                            <p>用户名称</p>
                            <p>皮卡丘</p>
                        </div>
                        <hr>
                        <!-- 用户性别 -->
                        <div class="user-info-detail-item">
                            <p>用户性别</p>
                            <p>保密</p>
                        </div>
                        <hr>
                        <!--用户部门-->
                        <div class="user-info-detail-item">
                            <p>用户部门</p>
                            <p>人事部</p>
                        </div>
                        <hr>
                        <!--用户角色-->
                        <div class="user-info-detail-item">
                            <p>用户角色</p>
                            <p>运营</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-col-md9 card-hover">
            <div class="user-base layui-panel">
                <!--标题-->
                <div style="margin: 10px 0 0 10px">
                    <h4 style="color:#000000D9;">用户设置</h4>
                </div>
                <hr>
                <div class="user-edit-info">
                    <!-- 表单提交区 -->
                    <div style="width: 96%;margin: 0 auto;padding-bottom: 20px;">
                        <!-- 用户信息 -->
                        <div style="display: flex;padding: 15px 10px;border-radius: 5px;">
                            <div style="width: 40px;height: 40px;display: flex;justify-content: center;align-items: center;background-color: #ecf2ff;border-radius: 4px;">
                                <i style="font-size: 20px;color: #4080FF;cursor: pointer;" class="bi bi-person"></i>
                            </div>
                            <div style="margin-left: 10px;flex:1;height: 40px;display: flex;">
                                <div style="width: 50%;height: 40px;">
                                    <!-- 上层 -->
                                    <div style="height: 20px;font-size: 14px;color: #000;">用户信息</div>
                                    <!--下层  -->
                                    <div style="height: 20px;font-size: 13px;color: #909399;">修改名称和性别</div>
                                </div>
                                <div style="width: 50%;height: 40px;display: flex;align-items: center;justify-content: flex-end;">
                                    <button id="user-edit-btn" class="yaya-btn is-link-primary" type="button">修改</button>
                                </div>
                            </div>
                        </div>
                        <hr>
                        <!-- 账户密码 -->
                        <div style="display: flex;padding: 15px 10px;border-radius: 5px;">
                            <div style="width: 40px;height: 40px;display: flex;justify-content: center;align-items: center;background-color: #ffecfb;border-radius: 4px;">
                                <i style="font-size: 20px;color: #ff4291;cursor: pointer;" class="bi bi-shield-lock"></i>
                            </div>
                            <div style="margin-left: 10px;flex:1;height: 40px;display: flex;">
                                <div style="width: 50%;height: 40px;">
                                    <!-- 上层 -->
                                    <div style="height: 20px;font-size: 14px;color: #000;">账户密码</div>
                                    <!--下层  -->
                                    <div style="height: 20px;font-size: 13px;color: #909399;">定期修改密码有助于保护账户安全</div>
                                </div>
                                <div style="width: 50%;height: 40px;display: flex;align-items: center;justify-content: flex-end;">
                                    <button id="password-edit-btn" class="yaya-btn is-link-primary" type="button">修改</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="../layui/layui.js"></script>
<script>
    layui.use(function(){
        const $ = layui.$;
        const upload = layui.upload;

        //头像上传
        upload.render({
            elem: '#avatar-upload',
            url: '服务器上传接口地址',
            done: function(res){
                //上传成功
                $("#avatarImg")[0].src='后端返回的图片地址';
                //失败自己处理
            }
        });

        //修改用户
        $("#user-edit-btn").click(function (){
            layer.open({
                type: 2, // page 层类型 iframe
                area: ['450px', '330px'],
                title: '用户修改',
                offset:'20px',
                shade: 0.6, // 遮罩透明度
                shadeClose: true, // 点击遮罩区域，关闭弹层
                content: 'personal-center-user-edit.html',
                end: function(){
                    //刷新页面
                    window.parent.location.reload();
                }
            });
        });
        //修改密码
        $("#password-edit-btn").click(function (){
            layer.open({
                type: 2, // page 层类型 iframe
                area: ['450px', '280px'],
                title: '密码修改',
                offset:'20px',
                shade: 0.6, // 遮罩透明度
                shadeClose: true, // 点击遮罩区域，关闭弹层
                content: 'personal-center-password-edit.html',
                end: function(){
                    //刷新页面
                    window.parent.location.reload();
                }
            });
        });
    });
</script>
</body>
</html>
