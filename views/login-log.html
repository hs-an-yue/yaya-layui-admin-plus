<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 响应式配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- LayUI css库 -->
    <link rel="stylesheet" href="../layui/css/layui.css">
    <link rel="stylesheet" href="../css/yaya-common.css">
    <link rel="stylesheet" href="../css/yaya-style-extend.css">
    <title>登陆日志</title>
</head>
<body>
<div class="yaya-container">
    <div class="yaya-panel">
        <form class="layui-form" style="padding: 10px 0;">
            <div class="layui-row">
                <div class="layui-col-md3 layui-col-sm3 yaya-form-item">
                    <label class="yaya-form-label">用户名</label>
                    <div class="yaya-input-block">
                        <input type="text" placeholder="请输入" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-col-md3 layui-col-sm3 yaya-form-item">
                    <label class="yaya-form-label">状态</label>
                    <div class="yaya-input-block">
                        <select>
                            <option value="">状态</option>
                            <option value="1">成功</option>
                            <option value="0">失败</option>
                        </select>
                    </div>
                </div>
                <div class="layui-col-md3 layui-col-sm3 yaya-form-item" style="padding-top: 2px;">
                    <button type="button" class="yaya-btn yaya-primary">搜索</button>
                    <button type="reset" class="yaya-btn" style="margin-left: 10px;">重置</button>
                </div>
            </div>
        </form>
    </div>
    <div class="yaya-panel" style="margin-top: 15px;padding: 10px;">
        <table class="layui-hide" id="table-login-log" lay-filter="table-login-log"></table>
    </div>
</div>
    <script src="../layui/layui.js"></script>
    <script>
        layui.use(function (){
            const table = layui.table;

            //渲染
            table.render({
                elem: '#table-login-log',
                url: '../data/login-log.json',
                page: {
                    prev:'上一页',
                    next:'下一页',
                    theme:'#1e9fff'
                },
                skin:'line',
                cols: [[
                    {type: 'numbers', fixed: 'left'},
                    {field:'createTime', title: '操作时间',width:200},
                    {field:'username', title: '操作人'},
                    {field:'requestUrl', title: '地址'},
                    {field:'params', title: '参数',width:250},
                    {field:'ip', title: 'IP'},
                    {field:'address', title: '城市'},
                    {field:'os', title: '系统'},
                    {field:'errorMsg', title: '提示消息'},
                    {
                        title: '状态',
                        fixed: 'right',
                        templet:function (row){
                            let status = row.status;
                            if(status===0){
                                return '<span class="yaya-tag yaya-tag-plain-danger is-round tag-small">失败</span>';
                            }else {
                                return '<span class="yaya-tag yaya-tag-plain-success is-round tag-small">成功</span>';
                            }
                        }
                    }
                ]],
                parseData: function(res){ // res 即为原始返回的数据
                    return {
                        "code": res.code, // 解析接口状态
                        "msg": res.msg, // 解析提示文本
                        "count": res.data.count, // 解析数据长度
                        "data": res.data.list // 解析数据列表
                    };
                }
            })
        });
    </script>
</body>
</html>
