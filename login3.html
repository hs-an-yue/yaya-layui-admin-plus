<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="layui/css/layui.css">
    <title>AI 智能助手 - 登录</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", 
                         "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #a5d6ff, #e0f0ff);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            display: flex;
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(100, 150, 255, 0.3);
            overflow: hidden;
        }
        
        /* 左侧 AI 区域 */
        .left-panel {
            flex: 1;
            padding: 60px 50px;
            background: linear-gradient(180deg, #f0f8ff, #e0f0ff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .ai-cube {
            width: 240px;
            height: 240px;
            background: linear-gradient(145deg, #4a9eff, #1e7eff);
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 25px 60px rgba(30, 126, 255, 0.5);
            animation: float 4s ease-in-out infinite;
        }
        
        .ai-logo { 
            font-size: 130px; 
            font-weight: 900; 
            color: white; 
            text-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        
        .title { 
            margin-top: 50px; 
            font-size: 30px; 
            font-weight: 700; 
            color: #1e3a8a; 
        }
        
        .subtitle { 
            color: #64748b; 
            margin-top: 12px; 
            text-align: center; 
            line-height: 1.6;
            font-size: 17px;
        }

        /* 右侧登录区 */
        .right-panel {
            width: 420px;
            padding: 50px 45px;
            background: white;
        }
        
        .tabs {
            display: flex;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 30px;
        }
        
        .tab {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab.active {
            color: #1e7eff;
            font-weight: 600;
            border-bottom: 3px solid #1e7eff;
        }
        
        .form-group {
            margin-bottom: 22px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #64748b;
            font-size: 14px;
        }
        
        /* 验证码输入框 */
        .code-group {
            display: flex;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
        }
        
        .code-input {
            flex: 1;
            padding: 14px 16px;
            border: none;
            background: transparent;
            font-size: 16px;
            outline: none;
        }
        
        .get-code {
            padding: 14px 20px;
            color: #1e7eff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            background: transparent;
            border-left: 1px solid #e2e8f0;
            white-space: nowrap;
            transition: all 0.3s;
        }
        
        .get-code:hover {
            background: #f0f7ff;
            color: #1565c0;
        }
        
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #1e7eff, #3b9eff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(30, 126, 255, 0.4);
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧 -->
        <div class="left-panel">
            <div class="ai-cube">
                <div class="ai-logo">Ai</div>
            </div>
            
            <div class="title">强大AI功能</div>
            <div class="subtitle">
                人工智能高效处理<br>
                复杂图文理解应对
            </div>
        </div>
        
        <!-- 右侧登录区 -->
        <div class="right-panel">
            <div class="tabs">
                <div class="tab active" data-tab="1">短信登录</div>
                <div class="tab" data-tab="3">账号登录</div>
            </div>
            
            <!-- 短信登录 -->
            <div id="tab1" class="tab-content">
                <div class="form-group">
                    <label>手机号</label>
                    <input type="tel" placeholder="请输入手机号"
                           style="padding:14px 16px; border-radius:12px; border:1px solid #e2e8f0; width:100%;">
                </div>
                
                <div class="form-group">
                    <label>验证码</label>
                    <div class="code-group">
                        <input type="text" class="code-input" placeholder="请输入验证码">
                        <span class="get-code" onclick="sendCode()">获取验证码</span>
                    </div>
                </div>
                
                <button class="login-btn" onclick="login()">登录 / 注册</button>
            </div>
            
            <!-- 账号登录 -->
            <div id="tab3" class="tab-content" style="display:none;">
                <div class="form-group">
                    <label>账号</label>
                    <input type="text" placeholder="请输入账号/邮箱/手机号" style="padding:14px 16px; border-radius:12px; border:1px solid #e2e8f0; width:100%;">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" placeholder="请输入密码" style="padding:14px 16px; border-radius:12px; border:1px solid #e2e8f0; width:100%;">
                </div>
                <button class="login-btn" onclick="login()">登录</button>
            </div>
            
            <div style="margin-top:30px; text-align:center; font-size:13px; color:#64748b;">
                <label>
                    <input type="checkbox" checked> 我已阅读并同意 
                    <a href="#" style="color:#1e7eff">用户协议</a> 和 
                    <a href="#" style="color:#1e7eff">隐私政策</a>
                </label>
            </div>
        </div>
    </div>

    <script>
        // 标签切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
                document.getElementById('tab' + tab.getAttribute('data-tab')).style.display = 'block';
            });
        });
        
        function sendCode() {
            alert("✅ 验证码已发送！（演示）");
        }
        
        function login() {
            alert("🎉 登录成功！欢迎使用 AI 智能助手");
        }
    </script>
</body>
</html>
