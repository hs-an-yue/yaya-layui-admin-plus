<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 标签icon设置 -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <title>AI助手 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Inter, system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #f8fafc 50%, #f0fdfa 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }
        /* 背景浮动光点 */
        .dot {
            position: absolute;
            border-radius: 999px;
            background-color: rgba(79, 70, 229, 0.12);
            animation: float 8s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        /* 登录卡片 */
        .login-card {
            width: 100%;
            max-width: 440px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(79, 70, 229, 0.08);
            padding: 40px 32px;
            z-index: 10;
        }
        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background-color: rgba(79, 70, 229, 0.1);
            color: #4F46E5;
            margin-bottom: 16px;
        }
        .logo-icon svg {
            width:28px;
            height:28px;
            fill:#4F46E5;
        }
        .card-header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1e293b;
        }
        .card-header p {
            margin-top: 8px;
            color: #64748b;
        }
        .form-item {
            margin-bottom: 20px;
        }
        .form-item label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 6px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap .icon-left {
            position: absolute;
            left: 12px;
            top: 12px;
            color: #94a3b8;
        }
        .input-wrap .icon-left svg {
            width:18px;
            height:18px;
            fill:#94a3b8;
        }
        .input-wrap .icon-right {
            position: absolute;
            right: 12px;
            top: 12px;
            cursor: pointer;
        }
        .input-wrap .icon-right svg {
            width:18px;
            height:18px;
            fill:#94a3b8;
            transition: fill 0.2s;
        }
        .input-wrap .icon-right:hover svg {
            fill: #4F46E5;
        }
        .form-input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .form-input:focus {
            outline: none;
            border-color: #4F46E5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2);
        }
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .remember-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #475569;
        }
        .remember-box input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #4F46E5;
        }
        .link-text {
            font-size: 14px;
            color: #4F46E5;
            text-decoration: none;
        }
        .link-text:hover {
            text-decoration: underline;
        }
        .submit-btn {
            width: 100%;
            background-color: #4F46E5;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .submit-btn:hover {
            background-color: #4338ca;
        }
        .submit-btn:active {
            transform: scale(0.98);
        }
        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .register-tip {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }
        .tip-msg {
            margin-top:16px;
            text-align:center;
            font-size:14px;
        }
        .text-red {
            color:#ef4444;
        }
        .text-green {
            color:#10b981;
        }
        .hidden {
            display:none;
        }
    </style>
</head>
<body>
    <!-- 背景浮动装饰光点 AI氛围感 -->
    <div class="dot" style="width:96px;height:96px;top:10%;left:15%;animation-delay:0s;"></div>
    <div class="dot" style="width:64px;height:64px;top:65%;left:80%;animation-delay:2s;"></div>
    <div class="dot" style="width:80px;height:80px;top:30%;left:85%;animation-delay:4s;"></div>
    <div class="dot" style="width:48px;height:48px;top:75%;left:20%;animation-delay:6s;"></div>

    <!-- 登录卡片 -->
    <div class="login-card">
        <div class="card-header">
            <div class="logo-icon">
                <!-- robot SVG图标 -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-robot" viewBox="0 0 16 16">
                    <path d="M6 12.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5ZM3 8.062C3 6.76 4.235 5.765 5.53 5.886a26.58 26.58 0 0 0 4.94 0C11.765 5.765 13 6.76 13 8.062v1.157a.933.933 0 0 1-.765.935c-.845.147-2.34.346-4.235.346-1.895 0-3.39-.2-4.235-.346A.933.933 0 0 1 3 9.219V8.062Zm4.542-.827a.25.25 0 0 0-.217.068l-.92.9a24.767 24.767 0 0 1-1.871-.183.25.25 0 0 0-.068.495c.55.076 1.232.149 2.02.193a.25.25 0 0 0 .189-.071l.754-.736.847 1.71a.25.25 0 0 0 .404.062l.932-.97a25.286 25.286 0 0 0 1.922-.188.25.25 0 0 0-.068-.495c-.538.074-1.207.145-1.98.189a.25.25 0 0 0-.166.076l-.754.785-.842-1.7a.25.25 0 0 0-.182-.135Z"/>
                    <path d="M8.5 1.866a1 1 0 1 0-1 0V3h-2A4.5 4.5 0 0 0 1 7.5V8a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1v1a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1v-.5A4.5 4.5 0 0 0 10.5 3h-2V1.866ZM14 7.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7.5A3.5 3.5 0 0 1 5.5 4h5A3.5 3.5 0 0 1 14 7.5Z"/>
                </svg>
            </div>
            <h1>AI助手平台</h1>
            <p>欢迎回来，请登录您的账号</p>
        </div>

        <form id="loginForm">
            <div class="form-item">
                <label>账号</label>
                <div class="input-wrap">
                    <span class="icon-left">
                        <!-- user图标 -->
                        <svg viewBox="0 0 24 24">
                            <path d="M12 4a4 4 0 0 1 4 4 4 4 0 0 1-4 4 4 4 0 0 1-4-4 4 4 0 0 1 4-4m0 10c4.42 0 8 1.79 8 4v2H4v-2c0-2.21 3.58-4 8-4z"/>
                        </svg>
                    </span>
                    <input id="username" type="text" class="form-input" placeholder="账号/邮箱">
                </div>
            </div>

            <div class="form-item">
                <label>密码</label>
                <div class="input-wrap">
                    <span class="icon-left">
                        <!-- lock图标 -->
                        <svg viewBox="0 0 24 24">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                    </span>
                    <input id="password" type="password" class="form-input" placeholder="密码">
                    <span id="togglePwd" class="icon-right">
                        <!-- eye‑slash 默认隐藏密码图标 -->
                        <svg id="iconEyeSlash" viewBox="0 0 24 24">
                            <path d="M2 5.27L3.28 4 20 20.72 18.73 22l-3.08-3.08c-1.15.38-2.37.58-3.65.58-5 0-9-3.27-9-8 0-1.73.64-3.33 1.74-4.54L2 5.27M12 9a3 3 0 0 1 3 3 3 3 0 0 1-.17 1L11 9.17A3 3 0 0 1 12 9m0-5c5 0 9 3.27 9 8 0 1.73-.64 3.33-1.74 4.54l-2.52-2.52A5 5 0 0 0 7.97 9l-2.5-2.5C6.66 5.64 8.27 4 12 4z"/>
                        </svg>
                        <!-- eye 查看密码图标，默认隐藏 -->
                        <svg id="iconEye" style="display:none;" viewBox="0 0 24 24">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5M12 17a5 5 0 0 1-5-5 5 5 0 0 1 5-5 5 5 0 0 1 5 5 5 5 0 0 1-5 5m0-8a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/>
                        </svg>
                    </span>
                </div>
            </div>

            <div class="form-row">
                <label class="remember-box">
                    <input type="checkbox" id="remember">
                    <span>记住我</span>
                </label>
                <a href="#" class="link-text">忘记密码？</a>
            </div>

            <button id="submitBtn" type="submit" class="submit-btn">登录</button>
        </form>

        <div id="tipMsg" class="tip-msg hidden"></div>
    </div>

<script>
    const loginForm = document.getElementById('loginForm');
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const togglePwd = document.getElementById('togglePwd');
    const iconEyeSlash = document.getElementById('iconEyeSlash');
    const iconEye = document.getElementById('iconEye');
    const tipMsg = document.getElementById('tipMsg');
    const submitBtn = document.getElementById('submitBtn');

    // 显示/隐藏密码切换SVG图标
    togglePwd.addEventListener('click', () => {
        if(password.type === 'password'){
            password.type = 'text';
            iconEyeSlash.style.display = 'none';
            iconEye.style.display = 'block';
        }else{
            password.type = 'password';
            iconEyeSlash.style.display = 'block';
            iconEye.style.display = 'none';
        }
    })

    // 表单提交校验
    loginForm.addEventListener('submit', function(e){
        e.preventDefault();
        tipMsg.classList.remove('hidden','text-red','text-green');

        const userVal = username.value.trim();
        const pwdVal = password.value.trim();

        if(!userVal){
            tipMsg.innerText = '请输入账号';
            tipMsg.classList.add('text-red');
            tipMsg.classList.remove('hidden');
            return;
        }
        if(!pwdVal){
            tipMsg.innerText = '请输入密码';
            tipMsg.classList.add('text-red');
            tipMsg.classList.remove('hidden');
            return;
        }

        // 模拟登录请求
        submitBtn.disabled = true;
        submitBtn.innerText = "登录中...";

        setTimeout(()=>{
            tipMsg.innerText = "登录成功！正在跳转AI工作台";
            tipMsg.classList.add('text-green');
            tipMsg.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.innerText = "登录";
            // window.location.href = "/dashboard"; //实际项目跳转后台
        },1200)
    })
</script>
</body>
</html>
